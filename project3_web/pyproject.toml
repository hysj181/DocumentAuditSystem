[project]
name = "document-audit-web"
version = "0.1.0"
description = "DocumentAuditSystem V2.0 unified web environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "doc-extractor",
    "project2-word-audit",
    "project3-cli-workflow",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "pydantic==2.14.2",
    "typer==0.27.3",
    "rich==15.0.0",
    "pymupdf==2.0",
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
    "paddlex[ocr]==3.7.2",
    "python-docx==1.2.0",
    "pyside6==6.12.0",
    "numpy==2.3.5",
    "onnxruntime==1.31.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "project3_web"
module-root = "src"

[tool.uv.sources]
doc-extractor = { path = "../project1_extraction", editable = true }
project2-word-audit = { path = "../project2_word_audit", editable = true }
project3-cli-workflow = { path = "../project3_cli_workflow", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
