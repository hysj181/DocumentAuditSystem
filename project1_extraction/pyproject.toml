[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extractor"
version = "0.6.0"
description = "Comprehensive environmental data extraction system (DocumentAuditSystem project 1)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DocumentAuditSystem" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business",
]
dependencies = [
    "PySide6>=6.7,<7",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
    "paddleocr>=3,<4",
    "paddlepaddle>=3,<4",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
doc-extractor = "doc_extractor.app:main"
doc-extractor-cli = "doc_extractor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
